name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows MSI and NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build installers
        run: cargo tauri build --bundles msi,nsis
      - uses: actions/upload-artifact@v4
        with:
          name: madar-windows-x64
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS app and DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build app and DMG
        run: cargo tauri build --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: madar-macos
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  ubuntu:
    name: Ubuntu DEB and AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build packages
        run: cargo tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: madar-ubuntu-22.04-x64
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
  
  fedora:
    name: Fedora RPM
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install Git and Node.js for GitHub Actions
        run: |
          dnf install -y git nodejs curl
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Fedora build dependencies
        run: |
          dnf install -y \
            gcc gcc-c++ make pkgconf-pkg-config \
            curl wget file openssl-devel libxdo-devel \
            webkit2gtk4.1-devel gtk3-devel \
            libappindicator-gtk3-devel librsvg2-devel \
            patchelf rpm-build
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build RPM package
        run: cargo tauri build --bundles rpm
      - uses: actions/upload-artifact@v4
        with:
          name: madar-fedora-rpm-x86_64
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Git and Node.js for GitHub Actions
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git nodejs
      - uses: actions/checkout@v4
      - name: Install Arch build dependencies
        run: |
          pacman -S --needed --noconfirm \
            webkit2gtk-4.1 gtk3 openssl libappindicator-gtk3 \
            librsvg pkgconf curl wget file
      - name: Create unprivileged build user and install Rust
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder \
            bash -lc 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal'
      - name: Build Arch package
        run: |
          runuser -u builder -- env \
            HOME=/home/builder \
            PATH=/home/builder/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin \
            bash scripts/build-arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: madar-arch-x86_64
          path: src-tauri/target/release/bundle/arch/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 14
