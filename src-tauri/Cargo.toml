[package]
name = "madar"
version = "0.1.0"
description = "مدار - نظام إدارة الأعمال"
license = "GPL-3.0-only"
authors = ["Madar contributors"]
edition = "2021"

[lib]
name = "madar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
thiserror = "2"
