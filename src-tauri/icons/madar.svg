<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Madar app icon</title>
  <desc id="desc">A bright inventory cube orbiting inside a deep blue rounded square, representing business flow and organization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123A8C"/>
      <stop offset="0.52" stop-color="#155EEF"/>
      <stop offset="1" stop-color="#08275D"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9F4FF"/>
      <stop offset="1" stop-color="#65DDF5"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54D9F4"/>
      <stop offset="1" stop-color="#1C9FE0"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DFF9FF"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="984" height="984" rx="238" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="352" fill="#FFFFFF" opacity="0.035"/>
  <!-- The orbit is deliberately open on one side to keep the mark clear at small sizes. -->
  <path d="M 221 636 C 129 455 254 266 454 220 C 641 176 819 283 840 426" fill="none" stroke="#9CECFB" stroke-width="29" stroke-linecap="round" opacity="0.96"/>
  <path d="M 811 579 C 748 746 553 831 379 775" fill="none" stroke="#45C9EF" stroke-width="25" stroke-linecap="round" opacity="0.9"/>
  <circle cx="837" cy="431" r="43" fill="#FBBF5A" stroke="#FFFFFF" stroke-width="13"/>
  <!-- Business inventory carton -->
  <path d="M512 288 730 405 512 524 294 405Z" fill="url(#top)" stroke="#FFFFFF" stroke-width="13" stroke-linejoin="round"/>
  <path d="M294 405 512 524 512 748 294 628Z" fill="url(#left)" stroke="#FFFFFF" stroke-width="13" stroke-linejoin="round"/>
  <path d="M730 405 512 524 512 748 730 628Z" fill="url(#right)" stroke="#FFFFFF" stroke-width="13" stroke-linejoin="round"/>
  <!-- A central route/divider subtly forms the letter M's middle stroke. -->
  <path d="M512 524V748" stroke="#0B3476" stroke-width="18" stroke-linecap="round" opacity="0.82"/>
  <path d="M390 457 512 523 633 457" fill="none" stroke="#1553A2" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M358 579 435 621" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.88"/>
  <path d="M586 621 667 577" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.88"/>
</svg>
