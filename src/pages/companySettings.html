<section class="page" data-page-content="companySettings" data-any-permission="company.settings.view company.settings.manage" hidden>
 <div class="page-title"><h2>بيانات الشركة</h2><p>تظهر هذه البيانات في فواتير المبيعات والمشتريات وعروض الأسعار المطبوعة.</p></div>
 <section class="panel"><form id="companyProfileForm"><div class="grid"><label class="field">اسم الشركة / النشاط<input id="companyName" required maxlength="180"/></label><label class="field">رقم الهاتف<input id="companyPhone" maxlength="60" type="tel"/></label><label class="field">البريد الإلكتروني<input id="companyEmail" maxlength="254" type="email"/></label><label class="field">الموقع الإلكتروني<input id="companyWebsite" maxlength="250" type="url"/></label><label class="field">الرقم الضريبي<input id="companyTaxNumber" maxlength="100"/></label><label class="field">السجل التجاري<input id="companyCommercialRegister" maxlength="100"/></label><label class="field" style="grid-column:1/-1">العنوان<textarea id="companyAddress" maxlength="500"></textarea></label><label class="field">العملة<select id="companyCurrency"><option value="EGP">EGP — جنيه مصري</option><option value="SAR">SAR — ريال سعودي</option><option value="AED">AED — درهم إماراتي</option><option value="USD">USD — دولار أمريكي</option><option value="EUR">EUR — يورو</option></select></label><label class="field">نسبة الضريبة (%)<input id="companyTaxRate" type="number" min="0" max="100" step="0.01" required value="0"/></label><label class="field">طريقة احتساب الضريبة<select id="companyPricesIncludeTax"><option value="false">الأسعار غير شاملة الضريبة (تضاف إلى الإجمالي)</option><option value="true">الأسعار شاملة الضريبة</option></select></label><label class="field" style="grid-column:1/-1"><small class="muted">تُطبّق هذه الإعدادات على الفواتير وعروض الأسعار الجديدة، وتُحفظ نسبة الضريبة وطريقتها مع كل مستند. المستندات القديمة لا يُعاد احتسابها.</small></label><label class="field">الشعار (PNG/JPG/WebP)<input id="companyLogoFile" type="file" accept="image/png,image/jpeg,image/webp"/></label><div class="field"><span>معاينة الشعار</span><img id="companyLogoPreview" alt="معاينة شعار الشركة" style="max-width:180px;max-height:90px;object-fit:contain;display:none"/><button id="clearCompanyLogo" class="btn secondary small-btn" type="button">إزالة الشعار</button></div><label class="field" style="grid-column:1/-1">التذييل المطبوع<input id="companyInvoiceFooter" maxlength="500" placeholder="مثال: شكرًا لثقتكم بنا"/></label></div><div class="confirm-actions"><button class="btn" type="submit" id="saveCompanyProfileBtn">حفظ بيانات الشركة</button></div><div id="companySettingsStatus" class="status" role="status" aria-live="polite"></div></form><div id="companyReadonlyNotice" class="muted" hidden>يمكنك عرض بيانات الشركة، ولا تملك صلاحية تعديلها.</div></section>
</section>
